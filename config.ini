[General]
; Enables high resolution timer for Windows 10/11 (fixes FPS stuttering)
HighResolutionTimer = 1

; Enables extended sprite limit (> 65,535 sprites via uint32_t)
ExtendedSprites = 1

; Enables support for 32-bit Alpha transparency (ARGB)
AlphaTransparency = 0

; Enables in-memory sprite texture caching for higher performance
CacheSprites = 1

[Features]
; Enables mana bar drawn below the player
DrawManaBar = 1

; Enables mounts system and layer elevation (+3px)
EnableMounts = 1

; Enables Market System graphical interface
EnableMarket = 1

; Enables extended server communication channel (Opcode 0x32)
ExtendedOpcode = 1

[Limits]
; Breaks magic effects limit (uint8_t 255 -> uint16_t 65535)
ExtendedMagicEffects = 1

; Breaks player health and mana display limit (uint16_t -> int32_t)
ExtendedPlayerStats = 1

; Breaks player skills display limit (uint8_t -> uint16_t)
ExtendedPlayerSkills = 0

[Network]
; Automatically redirect login servers to this IP and Port (no IP Changer needed if set)
; Leave empty ("") if you prefer using an external IP Changer
ServerIP = 127.0.0.1
ServerPort = 7171

; Optional Custom RSA Key (1024-bit decimal). If empty, standard OpenTibia RSA key is used automatically.
CustomRSAKey = 
